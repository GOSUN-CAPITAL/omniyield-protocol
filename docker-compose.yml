version: "3.8"

services:
  contracts-test:
    image: rust:1.80-slim
    working_dir: /app/contracts
    volumes:
      - .:/app
    command: >
      sh -c "cargo test -- --nocapture"

  allocator-service:
    image: node:20-alpine
    working_dir: /app/services
    volumes:
      - .:/app
    command: >
      sh -c "npm install && npm run simulate"
    environment:
      - NODE_ENV=development
      - VAULT_CONTRACT_ID=omniflow-vault.near

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_CONTRACT_ID=omniflow-vault.near

