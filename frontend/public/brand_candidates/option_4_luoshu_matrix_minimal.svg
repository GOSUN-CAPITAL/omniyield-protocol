<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Emerald Jade Glow -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Deep Matte Obsidian Background with Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- 2. Pure Minimalist 3x3 Luoshu Nine Palace Coordinates:
       Left: 144, Center: 256, Right: 368
       Top: 144, Center: 256, Bottom: 368
  -->

  <!-- The 8 Outer Connected Circuit Links (Minimal 2-Line Diamond of 15 Balance) -->
  <polygon points="256,144 368,256 256,368 144,256" 
           fill="none" 
           stroke="url(#emeraldGrad)" 
           stroke-width="18" 
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Outer 8 Clean Solid Nodes (Clean Vector Geometry) -->
  <!-- Top 9 (South Fire) -->
  <circle cx="256" cy="144" r="18" fill="#00FFA3"/>
  <circle cx="256" cy="144" r="8" fill="#FFFFFF"/>

  <!-- Right 7 (West Metal) -->
  <circle cx="368" cy="256" r="18" fill="#00FFA3"/>
  <circle cx="368" cy="256" r="8" fill="#FFFFFF"/>

  <!-- Bottom 1 (North Water) -->
  <circle cx="256" cy="368" r="18" fill="#00FFA3"/>
  <circle cx="256" cy="368" r="8" fill="#FFFFFF"/>

  <!-- Left 3 (East Wood) -->
  <circle cx="144" cy="256" r="18" fill="#00FFA3"/>
  <circle cx="144" cy="256" r="8" fill="#FFFFFF"/>

  <!-- 4 Corner Pure Dots (4, 2, 8, 6) -->
  <circle cx="144" cy="144" r="12" fill="#10B981" opacity="0.85"/>
  <circle cx="368" cy="144" r="12" fill="#10B981" opacity="0.85"/>
  <circle cx="144" cy="368" r="12" fill="#10B981" opacity="0.85"/>
  <circle cx="368" cy="368" r="12" fill="#10B981" opacity="0.85"/>

  <!-- 3. Central Sovereign 5 Core (Earth / Vault) -->
  <!-- Crisp Golden Solid Focal Core -->
  <circle cx="256" cy="256" r="32" fill="#FFD700" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="16" fill="#FFFFFF"/>
</svg>
